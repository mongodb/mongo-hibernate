# Mark a failure as a system/bootstrap failure (purple box) rather then a task
# failure by default.
# Actual testing tasks are marked with `type: test`
command_type: system

# Protect ourselves against rogue test case, or curl gone wild, that runs forever
exec_timeout_secs: 3600

# When a task that used to pass starts to fail, go through all versions that may have been skipped
# to detect when the task started failing
stepback: true

functions:
  fetch-source:
    # Executes git clone and applies the submitted patch, if any.
    - command: git.get_project
      params:
        directory: src

  create-expansions:
    - command: subprocess.exec
      params:
        working_dir: src
        binary: bash
        include_expansions_in_env:
          - is_patch
          - version_id
          - project
        args:
          - .evergreen/create-expansions.sh
    - command: expansions.update
      params:
        file: src/expansion.yml

  prepare-resources:
    - command: subprocess.exec
      params:
        working_dir: src
        binary: bash
        include_expansions_in_env:
          - DRIVERS_TOOLS
        args:
          - .evergreen/fetch-drivers-tools.sh

  bootstrap-mongo-orchestration:
    - command: subprocess.exec
      type: test
      params:
        binary: bash
        include_expansions_in_env:
          - TOPOLOGY
          - MONGODB_VERSION
          - MONGODB_BINARIES
        args:
          - ${DRIVERS_TOOLS}/.evergreen/run-orchestration.sh
    # run-orchestration generates expansion file with the MONGODB_URI for the cluster
    - command: expansions.update
      type: test
      params:
        file: mo-expansion.yml

  stop-mongo-orchestration:
    - command: subprocess.exec
      params:
        binary: bash
        args:
          - ${DRIVERS_TOOLS}/.evergreen/stop-orchestration.sh

  trace-artifacts:
    - command: subprocess.exec
      params:
        working_dir: src
        binary: bash
        add_to_path:
          - .evergreen
        env:
          PRODUCT_NAME: ${product_name}
        args:
          - ssdlc-expansions.sh
    - command: expansions.update
      params:
        file: src/ssdlc-expansions.yml
    # The set Maven Central receives, which the publish tasks mirror into build/repo. Signatures get
    # their own checksums, and there is no sha256/sha512 because publish.sh publishes only md5 and sha1.
    # The glob has no `**` and papertrail.trace rejects two patterns matching the same basename.
    - command: papertrail.trace
      params:
        key_id: ${papertrail_key_id}
        secret_key: ${papertrail_secret_key}
        product: ${product_name}
        version: ${product_version}
        filenames:
          - src/build/repo/org/mongodb/*/*/*.jar
          - src/build/repo/org/mongodb/*/*/*.pom
          - src/build/repo/org/mongodb/*/*/*.asc
          - src/build/repo/org/mongodb/*/*/*.jar.md5
          - src/build/repo/org/mongodb/*/*/*.pom.md5
          - src/build/repo/org/mongodb/*/*/*.asc.md5
          - src/build/repo/org/mongodb/*/*/*.jar.sha1
          - src/build/repo/org/mongodb/*/*/*.pom.sha1
          - src/build/repo/org/mongodb/*/*/*.asc.sha1
          - src/*/build/repo/org/mongodb/*/*/*.jar
          - src/*/build/repo/org/mongodb/*/*/*.pom
          - src/*/build/repo/org/mongodb/*/*/*.asc
          - src/*/build/repo/org/mongodb/*/*/*.jar.md5
          - src/*/build/repo/org/mongodb/*/*/*.pom.md5
          - src/*/build/repo/org/mongodb/*/*/*.asc.md5
          - src/*/build/repo/org/mongodb/*/*/*.jar.sha1
          - src/*/build/repo/org/mongodb/*/*/*.pom.sha1
          - src/*/build/repo/org/mongodb/*/*/*.asc.sha1

  create-and-upload-SSDLC-release-assets:
    # Reading code-scanning/analyses is 401 for anonymous callers even though the repository
    # is public, so the task mints an installation token scoped to that one permission.
    - command: github.generate_token
      params:
        owner: mongodb
        repo: mongo-hibernate
        expansion_name: ssdlc_github_token
        permissions:
          security_events: read
    - command: subprocess.exec
      params:
        working_dir: src
        binary: python3
        env:
          GITHUB_TOKEN: ${ssdlc_github_token}
        args:
          - .evergreen/download-codeql-sarifs.py
    - command: subprocess.exec
      params:
        working_dir: src
        binary: bash
        add_to_path:
          - .evergreen
        env:
          PRODUCT_NAME: ${product_name}
          PRODUCT_VERSION: ${product_version}
          EVERGREEN_VERSION_ID: ${version_id}
        args:
          - ssdlc-report.sh
    - command: ec2.assume_role
      params:
        role_arn: ${UPLOAD_SSDLC_RELEASE_ASSETS_ROLE_ARN}
    - command: s3.put
      params:
        aws_key: ${AWS_ACCESS_KEY_ID}
        aws_secret: ${AWS_SECRET_ACCESS_KEY}
        aws_session_token: ${AWS_SESSION_TOKEN}
        local_file: ./src/build/ssdlc/ssdlc_compliance_report.md
        remote_file: ${product_name}/${product_version}/ssdlc_compliance_report.md
        bucket: java-driver-release-assets
        region: us-west-1
        permissions: private
        content_type: text/markdown
        display_name: "ssdlc_compliance_report.md"
    - command: s3.put
      params:
        aws_key: ${AWS_ACCESS_KEY_ID}
        aws_secret: ${AWS_SECRET_ACCESS_KEY}
        aws_session_token: ${AWS_SESSION_TOKEN}
        local_files_include_filter:
          - build/ssdlc/static-analysis-reports/*.sarif
        local_files_include_filter_prefix: ./src/
        remote_file: ${product_name}/${product_version}/static-analysis-reports/
        bucket: java-driver-release-assets
        region: us-west-1
        permissions: private
        content_type: application/sarif+json
        display_name: "static-analysis-reports/"

  upload-test-results:
    - command: attach.xunit_results
      params:
        files:
          - src/build/test-results/test/TEST-*.xml
          - src/build/test-results/integrationTest/TEST-*.xml
          - src/*/build/test-results/test/TEST-*.xml
          - src/*/build/test-results/integrationTest/TEST-*.xml

  cleanup:
    - command: subprocess.exec
      params:
        command: rm -rf ${DRIVERS_TOOLS}

# Functions to run before all tasks (except those in task groups).
pre:
  - func: fetch-source
  - func: create-expansions
  - func: prepare-resources

# Functions to run after all tasks (except those in task groups).
post:
  - func: stop-mongo-orchestration
  - func: upload-test-results
  - func: cleanup

#######################################
#                Tasks                #
#######################################
tasks:
  - name: static-analysis
    tags:
      - pr
    commands:
      - command: subprocess.exec
        type: test
        params:
          working_dir: src
          binary: bash
          add_to_path:
            - .evergreen
          args:
            - static-checks.sh

  - name: run-unit-tests
    tags:
      - pr
    commands:
      - command: subprocess.exec
        type: test
        params:
          working_dir: src
          binary: bash
          add_to_path:
            - .evergreen
          args:
            - run-unit-tests.sh

  - name: run-integration-tests
    tags:
      - pr
    commands:
      - func: bootstrap-mongo-orchestration
      - command: subprocess.exec
        type: test
        params:
          working_dir: src
          binary: bash
          add_to_path:
            - .evergreen
          args:
            - run-integration-tests.sh

  - name: run-smoke-tests
    tags:
      - pr
    commands:
      - func: bootstrap-mongo-orchestration
      - command: subprocess.exec
        type: test
        params:
          working_dir: src
          binary: bash
          add_to_path:
            - .evergreen
          args:
            - run-smoke-tests.sh

  - name: publish-snapshot
    depends_on:
      - variant: static-checks
        name: static-analysis
    commands:
      - command: subprocess.exec
        params:
          working_dir: src
          binary: bash
          add_to_path:
            - .evergreen
          env:
            NEXUS_USERNAME: ${nexus_username}
            NEXUS_PASSWORD: ${nexus_password}
            SIGNING_PASSWORD: ${signing_password}
            SIGNING_KEY: ${signing_key}
            RELEASE: "false"
          args:
            - .evergreen/publish.sh
      - func: trace-artifacts
        vars:
          product_name: mongo-hibernate-snapshot
      - func: create-and-upload-SSDLC-release-assets

  - name: publish-release
    git_tag_only: true
    commands:
      - command: subprocess.exec
        params:
          working_dir: src
          binary: bash
          add_to_path:
            - .evergreen
          env:
            NEXUS_USERNAME: ${nexus_username}
            NEXUS_PASSWORD: ${nexus_password}
            SIGNING_PASSWORD: ${signing_password}
            SIGNING_KEY: ${signing_key}
            RELEASE: "true"
          args:
            - .evergreen/publish.sh
      - func: trace-artifacts
        vars:
          product_name: mongo-hibernate
      - func: create-and-upload-SSDLC-release-assets

########################################
#              Axes                    #
########################################
axes:
  - id: mongo-version
    display_name: "MongoDB Version"
    values:
      - id: "9.0"
        display_name: "9.0"
        variables:
          MONGODB_VERSION: "9.0"
      - id: "8.0"
        display_name: "8.0"
        variables:
          MONGODB_VERSION: "8.0"
      - id: "7.0"
        display_name: "7.0"
        variables:
          MONGODB_VERSION: "7.0"

  - id: topology
    display_name: Topology
    values:
      - id: replicaset
        display_name: "Replica Set"
        variables:
          TOPOLOGY: replica_set

  - id: os
    display_name: OS
    values:
      - id: linux
        display_name: Linux
        run_on: rhel80-small

########################################
#           Build Variants             #
########################################
buildvariants:

  - name: static-checks
    tags:
      - pr
    display_name: "Static Checks"
    run_on: rhel80-small
    tasks:
      - name: static-analysis

  - name: unit-tests
    tags:
      - pr
    display_name: "Unit Tests"
    run_on: rhel80-medium
    tasks:
      - name: run-unit-tests

  - matrix_name: run-smoke-tests
    matrix_spec: { mongo-version: "8.0", topology: replicaset, os: linux }
    display_name: "Smoke Tests"
    tags:
      - pr
    tasks:
      - name: run-smoke-tests

  - matrix_name: run-integration-tests
    matrix_spec: { mongo-version: "*", topology: "*", os: "*" }
    display_name: "${mongo-version} ${topology} ${os}"
    tags:
      - pr
    tasks:
      - name: run-integration-tests

  - name: publish-snapshot
    display_name: "Publish Snapshot"
    run_on: rhel80-small
    tasks:
      - name: publish-snapshot

  - name: publish-release
    display_name: "Publish Release"
    run_on: rhel80-small
    tasks:
      - name: publish-release
